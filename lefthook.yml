# Git hooks managed by lefthook — https://lefthook.dev
# Installed via the `prepare` script (`lefthook install`).
pre-commit:
  commands:
    format:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,mjs,cjs,ts,tsx}"
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
